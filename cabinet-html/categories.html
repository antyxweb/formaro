<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var m=localStorage.getItem('formaro_theme_mode')||'auto';var r=(m==='light'||m==='dark')?m:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',r);})();</script>
<title>Категории — Formaro Partner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
</head>
<body>
<div id="appShell">
  <aside class="sidebar" id="sidebarPlaceholder"></aside>
  <div class="app-main">
    <header class="topbar" id="topbarPlaceholder"></header>
    <div class="app-content">

      <div class="filter-bar d-flex flex-wrap gap-2 align-items-end justify-content-between">
        <div class="d-flex flex-wrap gap-2 align-items-end">
          <div><label class="form-label small mb-1">Поиск по названию</label>
            <input type="text" class="form-control" id="qInput" placeholder="Например: Обувь" style="min-width:220px;"></div>
          <button class="btn btn-outline-secondary" id="findBtn"><svg class="ic-inline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></button>
          <button class="btn btn-outline-secondary filter-clear-btn" id="clearBtn" title="Сбросить фильтры"><i class="bi bi-x-lg"></i></button>
          <div>
            <label class="form-label small mb-1 d-block invisible">.</label>
            <div class="form-check form-switch mb-0" style="height:38px;">
              <input class="form-check-input" type="checkbox" id="onlyMineToggle">
              <label class="form-check-label" for="onlyMineToggle">Только мои</label>
            </div>
          </div>
        </div>
        <a href="category-detail.html?id=new" class="btn btn-success"><svg class="ic-inline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg> Добавить свою категорию</a>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0 align-middle" id="categoriesTable">
              <thead><tr>
                <th class="row-check"><input type="checkbox" class="form-check-input" id="checkAll"></th>
                <th>Название</th><th>Родительский раздел</th><th>Статус</th><th>Товаров</th><th class="text-end">Действия</th>
              </tr></thead>
              <tbody id="categoriesBody"><tr><td colspan="6" class="text-center text-muted-2 py-4">Загрузка…</td></tr></tbody>
              <tfoot><tr><td class="table-footer-cell" colspan="6">
                <div class="table-footer-bar">
                  <div class="tf-left">
                    <button class="btn btn-outline-danger btn-sm d-none" id="bulkDeleteBtn"><svg class="ic-inline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Удалить выбранные</button>
                    <span class="tf-count"></span>
                  </div>
                  <div class="tf-right">
                    <div class="tf-pagesize">Показывать
                      <select class="form-select tf-pagesize-select">
                        <option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="500">500</option>
                      </select>
                    </div>
                    <div class="tf-pager"></div>
                  </div>
                </div>
              </td></tr></tfoot>
            </table>
          </div>
        </div>
      </div>

    </div>
    <footer class="app-footer" id="footerPlaceholder"></footer>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title confirm-title">Подтвердите действие</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><p class="confirm-message mb-0">Вы уверены?</p></div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button><button type="button" class="btn btn-primary confirm-ok-btn">Подтвердить</button></div>
</div></div></div>
<div class="modal fade" id="resultModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title result-title">Готово</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body d-flex align-items-center gap-3"><div class="result-icon fs-2"></div><p class="result-message mb-0">Действие выполнено.</p></div>
  <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Ок</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/categories.js"></script>
</body>
</html>
