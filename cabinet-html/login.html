<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var m=localStorage.getItem('formaro_theme_mode')||'auto';var r=(m==='light'||m==='dark')?m:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',r);})();</script>
<title>Вход — Formaro Partner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-logo"><div class="f-mark"><span></span><span></span><span></span></div>formaro</div>
    <p class="text-muted-2 mb-4">Кабинет партнёра маркетплейса</p>
    <div class="alert alert-info small">Прототип: подойдёт любой e-mail и пароль — данные не проверяются.</div>
    <form id="loginForm" onsubmit="return false;">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" value="info@specodezhda-plus.ru" required>
      </div>
      <div class="mb-3"><label class="form-label">Пароль</label><input type="password" class="form-control" id="password" value="demo1234" required></div>
      <div class="text-end mb-3"><a href="forgot-password.html" class="small">Забыли пароль?</a></div>
      <button type="submit" class="btn btn-primary w-100" id="loginBtn">Войти</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script>
$('#loginForm').on('submit', function () {
    var email = $('#email').val();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        $('#email').addClass('is-invalid');
        return;
    }
    $('#email').removeClass('is-invalid');
    window.location.href = 'index.html';
});
</script>
</body>
</html>
